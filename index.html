<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>¿Quién lo dijo? · Bultallas</title>
<style>
:root{
  --bg:#0b141a; --panel:#111b21; --bubble:#202c33; --line:#2a3942;
  --text:#e9edef; --muted:#8696a0; --accent:#00a884; --accent-2:#25d366;
  --ok:#1faa59; --ok-bg:#12382a; --bad:#e5484d; --bad-bg:#3b1a1d; --gold:#f5c542;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Color Emoji",sans-serif}
body{background:
  radial-gradient(1200px 500px at 50% -10%,#10303a 0%,transparent 60%),var(--bg);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:640px;margin:0 auto;padding:16px;min-height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:in .25s ease}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{font:inherit;color:inherit;cursor:pointer;border:0}

/* ---------- inicio ---------- */
.hero{margin:auto 0;text-align:center;padding:12px 0}
.cover{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r);margin-bottom:22px;display:none;border:1px solid var(--line)}
.cover.ok{display:block}
.logo{font-size:56px;line-height:1;margin-bottom:8px}
h1{font-size:34px;line-height:1.1;margin:0 0 10px;letter-spacing:-.5px}
h1 span{color:var(--accent-2)}
.sub{color:var(--muted);margin:0 auto 28px;max-width:30ch;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#04120e;
  font-weight:700;font-size:18px;padding:15px 30px;border-radius:999px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.meta{color:var(--muted);font-size:13px;margin-top:18px}

/* ---------- juego ---------- */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.prog{flex:1;height:8px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .35s ease}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:46px;text-align:right}
.score{color:var(--gold);font-weight:700;font-size:14px;min-width:46px}

.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 14px 16px;margin-bottom:16px;
  background-image:radial-gradient(circle at 20% 0,#142229 0,transparent 55%)}
.date{display:block;width:max-content;max-width:100%;margin:0 auto 14px;background:#182229;color:var(--muted);font-size:12.5px;
  padding:5px 12px;border-radius:8px;text-align:center}
.date:first-letter{text-transform:uppercase}
.bubble{position:relative;background:var(--bubble);border-radius:4px 14px 14px 14px;padding:12px 14px 10px;
  font-size:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.35);max-width:96%}
.bubble:before{content:"";position:absolute;left:-7px;top:0;border:7px solid transparent;border-top-color:var(--bubble);border-right-color:var(--bubble)}
.bubble .who{display:block;color:var(--accent-2);font-weight:700;font-size:14px;margin-bottom:4px;transition:color .2s}
.bubble.hidden .who{color:var(--muted);letter-spacing:2px}
.q{font-size:15px;color:var(--muted);margin:0 2px 10px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:2px solid var(--line);
  border-radius:14px;padding:10px 12px;min-height:64px;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt:disabled{cursor:default}
.opt .nm{font-weight:650;font-size:16px;line-height:1.2}
.opt.sel{border-color:var(--accent-2);background:#0f2a26;box-shadow:0 0 0 2px rgba(37,211,102,.25)}
.opts.photos{grid-template-columns:1fr 1fr!important;gap:12px}
.opt.ph{padding:0;overflow:hidden;aspect-ratio:4/5;min-height:0;border-radius:16px;position:relative;background:#182229}
.opt.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.opt.ph .bgb{position:absolute;inset:-12px;background-size:cover;background-position:center;filter:blur(14px) brightness(.5)}
.opt.ph .tick{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--accent-2);color:#04120e;display:none;place-items:center;font-weight:800}
.opt.ph.sel .tick{display:grid}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.45}
.opt .mark{margin-left:auto;font-size:20px}

.av{width:44px;height:44px;border-radius:50%;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;
  font-size:24px;background:var(--c,#2a3942);border:2px solid rgba(255,255,255,.08)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.sm{width:34px;height:34px;font-size:18px}

.next{margin-top:16px;display:flex;justify-content:center;min-height:56px}
.next .btn{display:none}
.next .btn.on{display:inline-flex}

/* ---------- resultado ---------- */
.res-head{text-align:center;margin:8px 0 18px}
.big{font-size:72px;font-weight:800;line-height:1;letter-spacing:-2px}
.big small{font-size:28px;color:var(--muted);font-weight:600;letter-spacing:0}
.verdict{margin:8px 0 0;color:var(--muted);font-size:17px}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.row{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:12px;padding:12px 14px}
.row.ok{border-left-color:var(--ok)}
.row .msg{font-size:14.5px;line-height:1.45;color:#cfd8dc;white-space:pre-wrap;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 10px}
.row .msg.open{display:block}
.row .d{color:var(--muted);font-size:12px;margin-bottom:6px}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:99px;background:#182229;border:1px solid var(--line)}
.chip.good{border-color:var(--ok);background:var(--ok-bg)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through;text-decoration-color:rgba(229,72,77,.7)}
.chip .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;margin-right:2px;text-decoration:none;display:inline-block}
.toggle{background:none;color:var(--accent-2);font-size:12.5px;padding:0;margin:-4px 0 10px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-bottom:20px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
</style>
</head>

</div>

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const groupOf = id => D.groups.findIndex(g => g.includes(id));

  /* ---- colores estables por miembro ---- */
  const hue = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

  /* ---- avatar: foto img/<id>.jpg|png|webp si existe; si no, emoji ---- */
  function avatar(id, small) {
    const m = M[id], el = document.createElement('span');
    el.className = 'av' + (small ? ' sm' : '');
    el.style.setProperty('--c', `hsl(${hue(id)} 38% 28%)`);
    el.textContent = m.e;
    const exts = ['jpg', 'png', 'webp', 'jpeg'];
    (function tryNext(i) {
      if (i >= exts.length) return;
      const img = new Image();
      img.alt = '';
      img.onload = () => { el.textContent = ''; el.appendChild(img); };
      img.onerror = () => tryNext(i + 1);
      img.src = `img/${id}.${exts[i]}`;
    })(0);
    return el;
  }

  /* ---- portada opcional img/portada.jpg ---- */
  (function cover() {
    const exts = ['jpg', 'png', 'webp', 'jpeg'];
    (function tryNext(i) {
      if (i >= exts.length) return;
      const img = $('cover');
      const probe = new Image();
      probe.onload = () => { img.src = probe.src; img.classList.add('ok'); $('logo').style.display = 'none'; };
      probe.onerror = () => tryNext(i + 1);
      probe.src = `img/portada.${exts[i]}`;
    })(0);
  })();

  /* ---- ¿qué miembros tienen foto? (img/<id>.jpg|png|webp|jpeg) ---- */
  const PHOTO = {};   // id -> url
  function probePhotos() {
    const exts = ['jpg', 'png', 'webp', 'jpeg'];
    return Promise.all(D.members.map(m => new Promise(res => {
      (function tryNext(i) {
        if (i >= exts.length) return res();
        const im = new Image();
        im.onload = () => { PHOTO[m.id] = im.src; res(); };
        im.onerror = () => tryNext(i + 1);
        im.src = `img/${m.id}.${exts[i]}`;
      })(0);
    })));
  }
  let photoMode = false;

  /* ---- fecha ---- */
  const fmtDate = iso => {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  };

  /* ---- selección de preguntas: 10 al azar, máx. 2 por autor ---- */
  function pickQuestions() {
    const pool = shuffle(D.qs.filter(q => !photoMode || PHOTO[q.a])), out = [], per = {};
    for (const q of pool) {
      if ((per[q.a] || 0) >= MAX_PER_AUTHOR) continue;
      per[q.a] = (per[q.a] || 0) + 1;
      out.push(q);
      if (out.length === ROUNDS) break;
    }
    return out;
  }

  /* ---- 4 opciones: la correcta + 3 que estuvieran activos ese año, sin repetir "familia" de nombre ---- */
  function buildOptions(q) {
    const year = q.d.slice(0, 4);
    const active = (D.act[year] || D.members.map(m => m.id)).filter(id => id !== q.a && (!photoMode || PHOTO[id]));
    const usedGroups = new Set(); const g0 = groupOf(q.a); if (g0 >= 0) usedGroups.add(g0);
    const chosen = [];
    for (const id of shuffle(active)) {
      const g = groupOf(id);
      if (g >= 0) { if (usedGroups.has(g)) continue; usedGroups.add(g); }
      chosen.push(id);
      if (chosen.length === OPTIONS - 1) break;
    }
    return shuffle([q.a, ...chosen]);
  }

  /* ---- estado ---- */
  let Q = [], idx = 0, answers = [], locked = false;

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
    window.scrollTo({ top: 0 });
  }

  async function start() {
    await probePhotos();
    photoMode = Object.keys(PHOTO).length >= 8;
    Q = pickQuestions().map(q => ({ ...q, opts: buildOptions(q) }));
    idx = 0; answers = [];
    show('s-game');
    render();
  }

  function render() {
    locked = false;
    const q = Q[idx];
    $('count').textContent = `${idx + 1}/${Q.length}`;
    $('bar').style.width = `${(idx / Q.length) * 100}%`;
    $('date').textContent = fmtDate(q.d);
    $('text').textContent = q.t;
    $('next').classList.remove('on');
    const box = $('opts'); box.innerHTML = '';
    box.classList.toggle('photos', photoMode);
    q.opts.forEach(id => {
      const b = document.createElement('button');
      b.dataset.id = id; b.setAttribute('aria-label', M[id].n);
      if (photoMode) {
        b.className = 'opt ph';
        const bg = document.createElement('div'); bg.className = 'bgb'; bg.style.backgroundImage = `url("${PHOTO[id]}")`; b.appendChild(bg);
        const im = new Image(); im.src = PHOTO[id]; im.alt = ''; b.appendChild(im);
        const k = document.createElement('span'); k.className = 'tick'; k.textContent = '✓'; b.appendChild(k);
      } else {
        b.className = 'opt';
        b.appendChild(avatar(id));
        const n = document.createElement('span'); n.className = 'nm'; n.textContent = M[id].n;
        b.appendChild(n);
      }
      b.addEventListener('click', () => answer(id));
      box.appendChild(b);
    });
  }

  /* Sin feedback: solo se marca la elección (se puede cambiar antes de pulsar Siguiente). */
  function answer(id) {
    const q = Q[idx];
    answers[idx] = { q, pick: id, ok: id === q.a };
    document.querySelectorAll('#opts .opt').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
    $('bar').style.width = `${((idx + 1) / Q.length) * 100}%`;
    $('next').textContent = idx === Q.length - 1 ? 'Ver resultado' : 'Siguiente →';
    $('next').classList.add('on');
  }

  function verdictFor(n) {
    if (n === 10) return '¡Perfecto! Los conoces mejor que sus madres.';
    if (n >= 8) return 'Casi clavado. Se nota que no te pierdes un mensaje.';
    if (n >= 6) return 'Bien, pero algún que otro te ha engañado.';
    if (n >= 4) return 'Justito. Lee más el grupo.';
    if (n >= 2) return 'Flojo… ¿seguro que estás en el chat?';
    return 'Cero patatero. ¿Estás en el grupo correcto?';
  }

  function chip(id, cls, label) {
    const c = document.createElement('span'); c.className = 'chip ' + cls;
    const l = document.createElement('span'); l.className = 'lbl'; l.textContent = label;
    c.appendChild(l); c.appendChild(avatar(id, true));
    const n = document.createElement('span'); n.textContent = M[id].n; c.appendChild(n);
    return c;
  }

  function finish() {
    const score = answers.filter(a => a.ok).length;
    $('final').textContent = score;
    $('verdict').textContent = verdictFor(score);
    const list = $('list'); list.innerHTML = '';
    answers.forEach((a, i) => {
      const r = document.createElement('div'); r.className = 'row' + (a.ok ? ' ok' : '');
      const d = document.createElement('div'); d.className = 'd'; d.textContent = `${i + 1}. ${fmtDate(a.q.d)}`;
      const msg = document.createElement('p'); msg.className = 'msg'; msg.textContent = a.q.t;
      r.appendChild(d); r.appendChild(msg);
      if (a.q.t.length > 150 || a.q.t.split('\n').length > 3) {
        const t = document.createElement('button'); t.className = 'toggle'; t.textContent = 'Ver entero';
        t.addEventListener('click', () => { const o = msg.classList.toggle('open'); t.textContent = o ? 'Ver menos' : 'Ver entero'; });
        r.appendChild(t);
      }
      const ans = document.createElement('div'); ans.className = 'ans';
      if (a.ok) ans.appendChild(chip(a.q.a, 'good', 'Acertaste'));
      else { ans.appendChild(chip(a.pick, 'bad', 'Tú')); ans.appendChild(chip(a.q.a, 'good', 'Era')); }
      r.appendChild(ans);
      list.appendChild(r);
    });
    show('s-end');
  }

  $('play').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('next').addEventListener('click', () => {
    if (!answers[idx]) return;
    if (idx === Q.length - 1) finish(); else { idx++; render(); }
  });
  $('share').addEventListener('click', async () => {
    const score = answers.filter(a => a.ok).length;
    const squares = answers.map(a => a.ok ? '🟩' : '🟥').join('');
    const text = `¿Quién lo dijo? · Bultallas\n${score}/10 ${squares}`;
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); $('share').textContent = '¡Copiado!'; setTimeout(() => $('share').textContent = 'Compartir resultado', 1600); }
    } catch (e) { /* cancelado */ }
  });
  document.addEventListener('keydown', e => {
    if (!$('s-game').classList.contains('on')) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= OPTIONS && Q[idx].opts[n - 1]) answer(Q[idx].opts[n - 1]);
    else if (e.key === 'Enter' && answers[idx]) $('next').click();
    
  });
})();
</script>
</body>
</html>
